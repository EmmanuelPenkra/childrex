name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: childrex-sequence-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with: {version: 11.26.0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm test:e2e
  image:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/emmanuelpenkra/childrex-sequence:${{ github.sha }}
  deploy:
    needs: image
    runs-on: [self-hosted, linux, ARM64, childrex-sequence-production]
    permissions: {contents: read, packages: read}
    environment: production
    steps:
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Deploy immutable image through scoped helper
        env:
          IMAGE: ghcr.io/emmanuelpenkra/childrex-sequence@${{ needs.image.outputs.digest }}
          BUILD_SHA: ${{ github.sha }}
        run: sudo /usr/local/sbin/deploy-childrex-sequence "$IMAGE" "$BUILD_SHA"
      - if: always()
        run: docker logout ghcr.io || true
