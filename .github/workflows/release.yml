name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: childrex-sequence-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with: {version: 11.26.0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: pnpm test:e2e
  deploy:
    needs: verify
    runs-on: [self-hosted, linux, ARM64, childrex-sequence-production]
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and replace service
        env:
          BUILD_SHA: ${{ github.sha }}
        run: docker compose -p childrex-sequence -f compose.production.yml up --build --force-recreate -d --wait --wait-timeout 180
      - name: Verify deployment
        run: |
          docker compose -p childrex-sequence -f compose.production.yml ps
          docker compose -p childrex-sequence -f compose.production.yml exec -T app wget -qO- http://127.0.0.1:3000/sequence/api/health/ready
