services:
  app:
    image: ${SEQUENCE_IMAGE:?Set SEQUENCE_IMAGE to an immutable GHCR digest}
    container_name: childrex-sequence-app
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_FILE: /data/rooms.json
      BUILD_SHA: ${BUILD_SHA:?Set BUILD_SHA}
      VIRTUAL_HOST: childrex.com
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: childrex.com
    volumes:
      - /srv/childrex-sequence/data:/data
    networks:
      - nginx-proxy
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/sequence/api/health/live]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  nginx-proxy:
    external: true
